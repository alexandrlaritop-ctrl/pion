<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 вариантов логотипа «Пион»</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Forum&family=Great+Vibes&family=Manrope:wght@500;700;800&family=Marck+Script&family=Playfair+Display:ital,wght@0,500;1,500&family=Prata&display=swap">
<style>
  :root { --bg: #1a0710; --gold: #d9b77e; --gold-2: #c8a063; --cream: #fbf6f0; --blush: #e8a0ad; --soft: #cdb3ad; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #efe7df; color: #2b0d17; font-family: Manrope, Arial, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 36px 20px 60px; }
  h1 { margin: 0; font: 600 40px/1.1 'Cormorant Garamond', serif; }
  .lead { margin: 6px 0 26px; color: #6c4b55; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .lg { margin: 0; overflow: hidden; border-radius: 22px; background: #fff; box-shadow: 0 0 0 1px #e6d8cb; }
  .lg__art { position: relative; display: grid; place-items: center; height: 300px; padding: 24px; background: radial-gradient(70% 80% at 50% 40%, #3b1022, var(--bg) 70%); color: var(--cream); }
  .lg figcaption { padding: 14px 18px 16px; }
  .lg figcaption b { display: block; font-size: 15px; }
  .lg figcaption span { display: block; margin-top: 2px; font-size: 13.5px; color: #6c4b55; }
  .tag { font: 700 11px/1 Manrope, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  .line { fill: none; stroke: var(--gold); stroke-linecap: round; stroke-linejoin: round; }

  /* 1. Цветок вместо «О» */
  .l1 { display: grid; justify-items: center; gap: 10px; }
  .l1 .w { display: flex; align-items: center; font: 600 76px/1 'Cormorant Garamond', serif; letter-spacing: .1em; padding-left: .1em; }
  .l1 svg { width: .74em; height: .74em; margin-right: .1em; }
  /* 2. Монограмма в арке */
  .l2 { display: grid; justify-items: center; gap: 12px; }
  .l2 .n { font: 400 30px/1 Forum, serif; letter-spacing: .42em; padding-left: .42em; }
  /* 3. Пион линией */
  .l3 { display: grid; justify-items: center; gap: 6px; }
  .l3 .n { font: 400 46px/1 Prata, serif; letter-spacing: .16em; padding-left: .16em; }
  /* 4. Рукописный */
  .l4 { display: grid; justify-items: center; }
  .l4 .n { position: relative; font: 400 118px/1 'Great Vibes', cursive; color: var(--gold); }
  .l4 svg { position: absolute; right: -26px; top: 6px; width: 34px; height: 34px; }
  /* 5. Печать */
  .l5 svg { width: 230px; height: 230px; }
  /* 6. Геометрия */
  .l6 { display: grid; justify-items: center; gap: 16px; }
  .l6 .n { font: 800 34px/1 Manrope, sans-serif; letter-spacing: .5em; padding-left: .5em; }
  /* 7. Ботаника */
  .l7 { display: flex; align-items: center; gap: 18px; }
  .l7 .t { display: grid; gap: 8px; }
  .l7 .n { font: italic 500 70px/1 'Playfair Display', serif; }
  /* 8. «П» из стеблей */
  .l8 { display: grid; justify-items: center; gap: 10px; }
  .l8 .n { font: 600 34px/1 'Cormorant Garamond', serif; letter-spacing: .36em; padding-left: .36em; }
  /* 9. Лепестки */
  .l9 { display: flex; align-items: center; gap: 20px; }
  .l9 .t { display: grid; gap: 8px; }
  .l9 .n { font: 600 66px/1 'Cormorant Garamond', serif; letter-spacing: .06em; }
  /* 10. Лента */
  .l10 { display: grid; justify-items: center; gap: 4px; }
  .l10 .n { font: 400 104px/1 'Marck Script', cursive; color: var(--cream); }
  .l10 svg { width: 300px; height: 46px; margin-top: -26px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ro" viewBox="0 0 64 64">
      <path d="M32 10A9.43 9.43 0 0 1 47.56 16.44A9.43 9.43 0 0 1 54 32A9.43 9.43 0 0 1 47.56 47.56A9.43 9.43 0 0 1 32 54A9.43 9.43 0 0 1 16.44 47.56A9.43 9.43 0 0 1 10 32A9.43 9.43 0 0 1 16.44 16.44A9.43 9.43 0 0 1 32 10Z"/>
      <path d="M38.14 19.42A6.56 6.56 0 0 1 45.66 28.95A6.56 6.56 0 0 1 42.9 40.78A6.56 6.56 0 0 1 31.93 46A6.56 6.56 0 0 1 21.01 40.67A6.56 6.56 0 0 1 18.37 28.82A6.56 6.56 0 0 1 25.99 19.36A6.56 6.56 0 0 1 38.14 19.42Z"/>
      <path d="M32 25.4A3.88 3.88 0 0 1 38.28 29.96A3.88 3.88 0 0 1 35.88 37.34A3.88 3.88 0 0 1 28.12 37.34A3.88 3.88 0 0 1 25.72 29.96A3.88 3.88 0 0 1 32 25.4Z"/>
      <circle cx="32" cy="32" r="1.8"/>
    </symbol>
    <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d7a8"/><stop offset=".55" stop-color="#d9b77e"/><stop offset="1" stop-color="#a97f45"/></linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7c9d1"/><stop offset="1" stop-color="#c9667c"/></linearGradient>
    <path id="petal" d="M20 58C6 50 0 34 4 20 7 10 14 4 20 9c6-5 13 1 16 11 4 14-2 30-16 38z"/>
  </defs>
</svg>

<div class="wrap">
  <h1>10 вариантов логотипа «Пион»</h1>
  <p class="lead">Все варианты в&nbsp;бордо с&nbsp;золотом, как сайт. Выберите один или&nbsp;два&nbsp;— доведём: подберём толщину линий, сделаем светлую версию и&nbsp;значок для соцсетей.</p>

  <div class="grid" id="sheet">
    <figure class="lg" id="lg-1">
      <div class="lg__art"><div class="l1">
        <span class="w">ПИ<svg viewBox="0 0 64 64" class="line" style="stroke-width:3.6"><use href="#ro"/></svg>Н</span>
        <span class="tag">цветочный магазин</span>
      </div></div>
      <figcaption><b>1. Цветок вместо «О»</b><span>Сейчас на сайте. Пион сверху в&nbsp;слове вместо буквы, строгий шрифт с&nbsp;засечками.</span></figcaption>
    </figure>

    <figure class="lg" id="lg-2">
      <div class="lg__art"><div class="l2">
        <svg viewBox="0 0 120 150" width="112" height="140" class="line" style="stroke-width:1.6">
          <path d="M14 144 V64 A46 46 0 0 1 106 64 V144 Z"/>
          <path d="M22 144 V66 A38 38 0 0 1 98 66 V144" style="stroke-width:.8;opacity:.7"/>
          <use href="#ro" x="49" y="30" width="22" height="22" style="stroke-width:3.6"/>
          <text x="60" y="124" text-anchor="middle" style="font:400 66px Forum,serif;fill:#fbf6f0;stroke:none">П</text>
        </svg>
        <span class="n">ПИОН</span>
        <span class="tag">цветочный магазин</span>
      </div></div>
      <figcaption><b>2. Монограмма в&nbsp;арке</b><span>Буква «П» в&nbsp;арке&nbsp;— той&nbsp;же, что у&nbsp;фото на&nbsp;сайте. Хорошо смотрится на&nbsp;пакетах и&nbsp;бирках.</span></figcaption>
    </figure>

    <figure class="lg" id="lg-3">
      <div class="lg__art"><div class="l3">
        <svg viewBox="0 0 120 124" width="134" height="138" class="line" style="stroke-width:2">
          <!-- головка пиона в три четверти: розетка, сжатая по высоте -->
          <g transform="translate(22 14) scale(1.19 .8)"><use href="#ro" width="64" height="64" style="vector-effect:non-scaling-stroke" class="line"/></g>
          <path d="M60 57C60 78 58 96 55 118"/>
          <path d="M58 90C48 83 37 85 31 92C39 98 50 98 58 90Z"/>
          <path d="M57 104C66 97 77 98 84 104C76 110 65 110 57 104Z"/>
          <path d="M58 90C50 90 42 91 36 92M57 104C65 104 73 104 79 104" style="stroke-width:1;opacity:.7"/>
        </svg>
        <span class="n">ПИОН</span>
        <span class="tag">цветочный магазин</span>
      </div></div>
      <figcaption><b>3. Пион линией</b><span>Цветок сбоку тонкой золотой линией, под&nbsp;ним название. Близко к&nbsp;вашему макету, но&nbsp;чище.</span></figcaption>
    </figure>

    <figure class="lg" id="lg-4">
      <div class="lg__art"><div class="l4">
        <span class="n">Пион<svg viewBox="0 0 64 64" class="line" style="stroke-width:4"><use href="#ro"/></svg></span>
        <span class="tag">цветочный магазин</span>
      </div></div>
      <figcaption><b>4. Рукописный</b><span>Название, будто написанное от&nbsp;руки, с&nbsp;маленьким цветком. Тёплый, «подарочный».</span></figcaption>
    </figure>

    <figure class="lg" id="lg-5">
      <div class="lg__art"><div class="l5">
        <svg viewBox="0 0 220 220">
          <defs><path id="ring5" d="M110 110m-86 0a86 86 0 1 1 172 0a86 86 0 1 1-172 0"/></defs>
          <circle cx="110" cy="110" r="106" class="line" style="stroke-width:1.6"/>
          <circle cx="110" cy="110" r="100" class="line" style="stroke-width:.7"/>
          <circle cx="110" cy="110" r="70" class="line" style="stroke-width:1"/>
          <text style="font:700 13px Manrope,sans-serif;fill:#d9b77e"><textPath href="#ring5" textLength="532" lengthAdjust="spacing">ЦВЕТОЧНЫЙ МАГАЗИН · ГОРНО-АЛТАЙСК ·</textPath></text>
          <use href="#ro" x="94" y="58" width="32" height="32" class="line" style="stroke-width:3.6"/>
          <text x="110" y="128" text-anchor="middle" style="font:400 36px Forum,serif;letter-spacing:6px;fill:#fbf6f0">ПИОН</text>
          <path d="M84 142H136" class="line" style="stroke-width:1"/>
          <text x="110" y="158" text-anchor="middle" style="font:700 9px Manrope,sans-serif;letter-spacing:3px;fill:#d9b77e">С ЛЮБОВЬЮ</text>
        </svg>
      </div></div>
      <figcaption><b>5. Печать</b><span>Круглый знак с&nbsp;городом. Для наклеек на&nbsp;коробки, открыток, аватарки в&nbsp;MAX и&nbsp;Telegram.</span></figcaption>
    </figure>

    <figure class="lg" id="lg-6">
      <div class="lg__art"><div class="l6">
        <svg viewBox="0 0 120 120" width="120" height="120" class="line" style="stroke-width:1.6">
          <circle cx="60" cy="38" r="20"/><circle cx="80.9" cy="48" r="20"/><circle cx="86" cy="70.6" r="20"/><circle cx="71.6" cy="88.7" r="20"/>
          <circle cx="48.4" cy="88.7" r="20"/><circle cx="34" cy="70.6" r="20"/><circle cx="39.1" cy="48" r="20"/>
          <circle cx="60" cy="64" r="9" style="fill:#d9b77e;stroke:none"/>
        </svg>
        <span class="n">ПИОН</span>
      </div></div>
      <figcaption><b>6. Геометрия</b><span>Цветок из&nbsp;одинаковых кругов и&nbsp;строгий шрифт без&nbsp;засечек. Современно, хорошо читается мелко.</span></figcaption>
    </figure>

    <figure class="lg" id="lg-7">
      <div class="lg__art"><div class="l7">
        <svg viewBox="0 0 80 130" width="80" height="130" class="line" style="stroke-width:2">
          <path d="M34 126C34 104 37 82 44 58"/>
          <path d="M44 58C30 52 27 34 42 20C58 33 57 51 44 58Z"/>
          <path d="M44 58C39 46 39 34 43 22"/>
          <path d="M44 58C50 48 52 37 49 27"/>
          <path d="M35 104C21 100 14 89 14 80C27 82 34 91 35 104Z"/>
          <path d="M38 86C50 80 59 82 64 75C55 70 44 73 38 86Z"/>
        </svg>
        <span class="t"><span class="n">Пион</span><span class="tag">цветочный магазин</span></span>
      </div></div>
      <figcaption><b>7. Ботаника</b><span>Бутон пиона на&nbsp;стебле и&nbsp;название курсивом в&nbsp;строку. Удобно для вывески и&nbsp;шапки сайта.</span></figcaption>
    </figure>

    <figure class="lg" id="lg-8">
      <div class="lg__art"><div class="l8">
        <svg viewBox="0 0 120 120" width="124" height="124" class="line" style="stroke-width:2.2">
          <path d="M32 112V46C32 34 44 28 60 28S88 34 88 46V112"/>
          <path d="M32 92C24 90 19 84 19 77C27 79 32 85 32 92Z"/>
          <path d="M88 92C96 90 101 84 101 77C93 79 88 85 88 92Z"/>
          <circle cx="60" cy="28" r="17" style="fill:#1a0710;stroke:none"/>
          <use href="#ro" x="42" y="10" width="36" height="36" style="stroke-width:3.4"/>
        </svg>
        <span class="n">ПИОН</span>
        <span class="tag">цветочный магазин</span>
      </div></div>
      <figcaption><b>8. «П» из&nbsp;стеблей</b><span>Два стебля и&nbsp;цветок сверху складываются в&nbsp;букву «П». Запоминающийся знак без&nbsp;слов.</span></figcaption>
    </figure>

    <figure class="lg" id="lg-9">
      <div class="lg__art"><div class="l9">
        <svg viewBox="0 0 120 120" width="112" height="112">
          <g transform="translate(60 60)">
            <use href="#petal" x="-20" y="-60" width="40" height="60" style="fill:url(#gb)"/>
            <use href="#petal" x="-20" y="-60" width="40" height="60" transform="rotate(90)" style="fill:url(#gp)"/>
            <use href="#petal" x="-20" y="-60" width="40" height="60" transform="rotate(180)" style="fill:url(#gb)"/>
            <use href="#petal" x="-20" y="-60" width="40" height="60" transform="rotate(270)" style="fill:url(#gp)"/>
            <circle r="7" style="fill:#1a0710"/><circle r="3.5" style="fill:#d9b77e"/>
          </g>
        </svg>
        <span class="t"><span class="n">Пион</span><span class="tag">цветочный магазин</span></span>
      </div></div>
      <figcaption><b>9. Лепестки</b><span>Четыре лепестка&nbsp;— розовые и&nbsp;золотые, как падающие лепестки на&nbsp;сайте. Самый яркий вариант.</span></figcaption>
    </figure>

    <figure class="lg" id="lg-10">
      <div class="lg__art"><div class="l10">
        <span class="n">Пион</span>
        <svg viewBox="0 0 300 46" class="line" style="stroke-width:1.8">
          <path d="M8 30C58 44 108 14 160 26S236 40 262 22"/>
          <path d="M262 22C252 10 264 4 270 14C276 4 290 10 278 22C270 26 266 26 262 22Z"/>
          <path d="M268 22L262 40M270 22L280 38"/>
        </svg>
        <span class="tag">цветочный магазин</span>
      </div></div>
      <figcaption><b>10. Лента</b><span>Название от&nbsp;руки и&nbsp;лента с&nbsp;бантом, как на&nbsp;букете. Лёгкий и&nbsp;праздничный.</span></figcaption>
    </figure>
  </div>
</div>
</body>
</html>
